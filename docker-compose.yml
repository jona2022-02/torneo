services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: torneo-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: TorneoDev_2026!
    ports:
      - "1433:1433"
    volumes:
      - torneo-sql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"TorneoDev_2026!\" -C -Q \"SELECT 1\" || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Torneo: Server=db,1433;Database=Torneo;User Id=sa;Password=TorneoDev_2026!;TrustServerCertificate=True;Encrypt=True
      Auth__Issuer: torneo
      Auth__Audience: torneo-frontend
      Auth__SigningKey: TorneoDev_SigningKey_2026_Mundialito
      Auth__Operator__Username: admin
      Auth__Operator__Password: TorneoDev_2026!
      Auth__Operator__DisplayName: Operador
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  torneo-sql-data:
