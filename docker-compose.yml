services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: torneo-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: TorneoDev_2026!
    ports:
      - "1433:1433"
    volumes:
      - torneo-sql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"TorneoDev_2026!\" -C -Q \"SELECT 1\" || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  torneo-sql-data:
